<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5D38F6" />
    <meta
      name="description"
      content="Bitry — Daily habit tracker with visual streaks, monthly calendars, and weekly stats."
    />

    <!-- PWA Manifest & App Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/bitry-icon-512.png" />
    <link rel="apple-touch-icon" href="/bitry-icon-512.png" />

    <title>Bitry — Daily Habit & Streak Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Register Service Worker for Google Play TWA / PWABuilder -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
